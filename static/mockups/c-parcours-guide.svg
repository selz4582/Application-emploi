<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Maquette C, Parcours guidé</title><desc id="desc">Parcours accessible en quatre étapes avec une tâche centrale.</desc>
